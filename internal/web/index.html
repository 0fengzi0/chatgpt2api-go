<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>chatgpt2api go</title>
  <style>
    :root{--bg:#f6f5f2;--panel:#fff;--line:#e7e4dc;--text:#1d1d1b;--muted:#77736a;--accent:#1d1d1b;--danger:#b53a3a;--ok:#26734d}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
    header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 24px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.92);position:sticky;top:0;z-index:5}
    h1{margin:0;font-size:17px;letter-spacing:-.02em}.muted{color:var(--muted)}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    main{max-width:1180px;margin:0 auto;padding:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
    .stat{font-size:26px;font-weight:700;letter-spacing:-.03em}.label{font-size:12px;color:var(--muted)}
    nav{display:flex;gap:4px;overflow:auto;padding:16px 0}.tab{border:0;background:transparent;padding:8px 12px;border-radius:9px;cursor:pointer;color:var(--muted)}
    .tab.active{background:var(--accent);color:#fff}.hidden{display:none!important}
    input,textarea,select,button{font:inherit}input,textarea,select{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:#fff;color:var(--text)}
    textarea{min-height:120px;resize:vertical}button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 12px;cursor:pointer}
    button.primary{background:var(--accent);border-color:var(--accent);color:#fff}button.danger{color:var(--danger)}button:disabled{opacity:.45;cursor:not-allowed}
    table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
    .pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:2px 8px;font-size:12px}.pill.ok{color:var(--ok);border-color:#b8dcc9}.pill.bad{color:var(--danger);border-color:#e8c0c0}
    .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}.thumb{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}.thumb img{display:block;width:100%;height:150px;object-fit:cover;background:#eee}.thumb div{padding:8px 10px;font-size:11px;color:var(--muted)}
    .section{margin-top:16px}.section h2{font-size:14px;margin:0 0 10px}.split{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}.settings-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.settings-grid .wide{grid-column:1/-1}@media(max-width:800px){.split{grid-template-columns:1fr}main{padding:16px}.settings-grid{grid-template-columns:1fr}.settings-grid .wide{grid-column:auto}}
    #toast{position:fixed;right:20px;bottom:20px;max-width:360px;background:#1d1d1b;color:#fff;padding:10px 14px;border-radius:10px;opacity:0;pointer-events:none;transition:.2s}#toast.show{opacity:1}
  </style>
</head>
<body>
<header>
  <div><h1>chatgpt2api <span class="muted">/ go</span></h1></div>
  <div class="row"><span id="authState" class="pill">未连接</span><button id="logoutBtn" class="hidden">清除密钥</button></div>
</header>
<main>
  <div id="loginPanel" class="card" style="max-width:620px;margin:40px auto">
    <h2 style="margin-top:0">管理密钥</h2>
    <p class="muted">所有管理请求都需要密钥。密钥只保存在当前浏览器会话中，不会写入 localStorage。</p>
    <input id="managementKey" type="password" placeholder="输入 remote-management.secret-key" autocomplete="off">
    <div class="row" style="margin-top:10px"><button class="primary" id="loginBtn">连接管理台</button><span id="keyHint" class="muted"></span></div>
  </div>
  <div id="app" class="hidden">
    <nav id="tabs"></nav>
    <section id="view-overview" class="view"></section>
    <section id="view-generate" class="view hidden"></section>
    <section id="view-accounts" class="view hidden"></section>
    <section id="view-images" class="view hidden"></section>
    <section id="view-keys" class="view hidden"></section>
    <section id="view-settings" class="view hidden"></section>
  </div>
</main>
<div id="toast"></div>
<script>
const $ = (s, root=document) => root.querySelector(s);
const state = {key: sessionStorage.getItem("ch2a_mgmt") || "", tab: "overview", jobs: []};
const tabs = [["overview","概览"],["generate","生图"],["accounts","账号池"],["images","图片"],["keys","API Key"],["settings","设置"]];
function toast(msg){const el=$("#toast");el.textContent=msg;el.classList.add("show");setTimeout(()=>el.classList.remove("show"),2600)}
async function api(path, opts={}){
  const headers = Object.assign({"Content-Type":"application/json","X-Management-Key":state.key}, opts.headers||{});
  const res = await fetch(path,{...opts,headers});
  const text = await res.text(); let data={}; try{data=text?JSON.parse(text):{}}catch{data={error:text}}
  if(!res.ok) throw new Error(data.error?.message||data.error||data.detail||("HTTP "+res.status));
  return data;
}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
function renderTabs(){
  $("#tabs").innerHTML=tabs.map(([id,label])=>`<button class="tab ${state.tab===id?"active":""}" data-tab="${id}">${label}</button>`).join("");
  document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;showTab()});
}
function showTab(){renderTabs();document.querySelectorAll(".view").forEach(v=>v.classList.add("hidden"));$("#view-"+state.tab).classList.remove("hidden");loadTab();}
async function loadTab(){
  if(state.tab==="overview") await loadOverview();
  if(state.tab==="generate") renderGenerate();
  if(state.tab==="accounts") await loadAccounts();
  if(state.tab==="images") await loadImages();
  if(state.tab==="keys") await loadKeys();
  if(state.tab==="settings") await loadSettings();
}
async function connect(key){
  state.key=key.trim(); if(!state.key) return toast("请输入管理密钥");
  try{await api("/api/status");sessionStorage.setItem("ch2a_mgmt",state.key);$("#loginPanel").classList.add("hidden");$("#app").classList.remove("hidden");$("#logoutBtn").classList.remove("hidden");$("#authState").textContent="已连接";$("#authState").className="pill ok";showTab();}
  catch(e){toast(e.message);$("#authState").textContent="密钥无效";$("#authState").className="pill bad";}
}
async function loadOverview(){
  try{const d=await api("/api/status");const s=d.stats||{};$("#view-overview").innerHTML=`
    <div class="grid">
      ${stat("账号",s.accounts_total)}${stat("可用",s.accounts_active)}${stat("限流",s.accounts_limited)}${stat("剩余额度",s.quota_total)}
      ${stat("运行任务",s.jobs_running)}${stat("排队任务",s.jobs_queued)}${stat("成功任务",s.jobs_succeeded)}${stat("图片",s.images_total)}
    </div>
    <div class="card section"><div class="row" style="justify-content:space-between"><div class="label">运行信息</div><button class="primary" onclick="loadTab()">刷新</button></div>
    <p class="muted">图片 worker: ${esc(d.config?.image_workers)} · API Key: ${esc(d.config?.api_keys)}</p></div>`;}catch(e){$("#view-overview").innerHTML=`<div class="card">${esc(e.message)}</div>`}
}
function stat(label,value){return `<div class="card"><div class="label">${label}</div><div class="stat">${esc(value??0)}</div></div>`}
function renderGenerate(){
  $("#view-generate").innerHTML=`<div class="split"><div class="card"><h2>新建图片任务</h2>
    <label class="label">提示词</label><textarea id="genPrompt" placeholder="描述你想生成的图片...">一只漂浮在太空里的猫</textarea>
    <div class="row" style="margin-top:10px"><select id="genModel" style="min-width:210px;flex:1"><option value="gpt-image-2" selected>gpt-image-2 · GPT Image 2</option><option value="gpt-image-2.5">gpt-image-2.5 · GPT Image 2.5</option></select><select id="genSize" style="width:190px"><option value="1024x1024">1024x1024 · 1:1</option><option value="1024x1536">1024x1536 · 2:3</option><option value="1536x1024">1536x1024 · 3:2</option><option value="1024x1365">1024x1365 · 3:4</option><option value="1365x1024">1365x1024 · 4:3</option><option value="1088x1920">1088x1920 · 9:16</option><option value="1920x1088">1920x1088 · 16:9</option><option value="2048x2048">2048x2048 · 1:1 2K</option><option value="2560x1440">2560x1440 · 16:9 2K</option><option value="1440x2560">1440x2560 · 9:16 2K</option><option value="3840x2160">3840x2160 · 16:9 4K</option><option value="2160x3840">2160x3840 · 9:16 4K</option><option value="auto">auto</option></select><select id="genQuality" style="width:140px"><option value="auto">auto · 自动</option><option value="low">low · 低</option><option value="medium">medium · 中</option><option value="high">high · 高</option></select><button class="primary" id="genBtn">提交任务</button></div><p id="genModelHint" class="muted" style="margin:6px 0 0"></p>
    <div class="section"><label class="label">参考图编辑（可选，上传后按编辑模式提交）</label><input id="editFiles" type="file" accept="image/*" multiple style="padding:7px"><button id="editBtn" style="margin-top:8px">提交编辑任务</button></div>
    <p class="muted">低配模式默认串行执行，队列按顺序处理。编辑任务会把参考图保存在本地 data/uploads。</p></div>
    <div class="card"><h2>任务状态</h2><div id="genResult" class="muted">暂无任务</div></div></div>
    <div class="card section"><h2>最近任务</h2><div id="genJobs"></div></div>`;
  $("#genBtn").onclick=submitGenerate; $("#editBtn").onclick=submitEdit; loadGenerationModels(); loadJobs();
}
async function loadGenerationModels(){
  const select=$("#genModel"); if(!select)return;
  try{const d=await api("/api/models");const rows=d.items||[];select.innerHTML=rows.map(m=>`<option value="${esc(m.id)}" ${m.id===d.default_model?"selected":""}>${esc(m.id)}${m.title&&m.title!==m.id?" · "+esc(m.title):""}</option>`).join("");$("#genModelHint").textContent=`图片模型 ${rows.length} 个`;}
  catch(e){select.innerHTML=`<option value="gpt-image-2" selected>gpt-image-2 · GPT Image 2</option><option value="gpt-image-2.5">gpt-image-2.5 · GPT Image 2.5</option>`;$("#genModelHint").textContent="模型列表加载失败，使用内置选项";toast(e.message)}
}
async function submitGenerate(){
  const prompt=$("#genPrompt").value.trim(); if(!prompt)return toast("请输入提示词");
  $("#genBtn").disabled=true;
  try{const job=await api("/api/image-tasks/generations",{method:"POST",body:JSON.stringify({prompt,model:$("#genModel").value,size:$("#genSize").value,quality:$("#genQuality").value,client_task_id:"ui-"+Date.now()})});
    $("#genResult").innerHTML=`<div class="pill">${esc(job.status)}</div><p class="muted">任务 ${esc(job.id)} 已提交，正在等待...</p>`; await pollJob(job.id);}
  catch(e){toast(e.message)}finally{$("#genBtn").disabled=false}
}
async function submitEdit(){
  const prompt=$("#genPrompt").value.trim(); const files=$("#editFiles").files; if(!prompt)return toast("请输入提示词"); if(!files||!files.length)return toast("请选择参考图");
  const form=new FormData(); form.append("prompt",prompt); form.append("model",$("#genModel").value); form.append("size",$("#genSize").value); form.append("quality",$("#genQuality").value); form.append("client_task_id","edit-ui-"+Date.now());
  for(const f of files)form.append("image",f);
  $("#editBtn").disabled=true;
  try{const res=await fetch("/api/image-tasks/edits",{method:"POST",headers:{"X-Management-Key":state.key},body:form});const job=await res.json();if(!res.ok)throw new Error(job.error||"edit failed");$("#genResult").innerHTML=`<div class="pill">${esc(job.status)}</div><p class="muted">编辑任务 ${esc(job.id)} 已提交...</p>`;await pollJob(job.id)}catch(e){toast(e.message)}finally{$("#editBtn").disabled=false}
}
async function pollJob(id){
  for(let i=0;i<120;i++){await new Promise(r=>setTimeout(r,1000));const d=await api("/api/image-tasks");const job=(d.items||[]).find(x=>x.id===id);if(!job)continue;
    if(job.status==="succeeded"){renderJob(job,true);loadJobs();return}
    if(job.status==="failed"||job.status==="canceled"){renderJob(job,true);loadJobs();return}
    $("#genResult").innerHTML=`<div class="pill">${esc(job.progress||job.status)}</div><p class="muted">任务 ${esc(job.id)} 处理中...</p>`;
  }
  toast("任务仍在后台运行，可稍后刷新");
}
function renderJob(job,big){
  const html=`<div class="row" style="align-items:flex-start">${(job.images||[]).map(img=>`<a href="${esc(img.url)}" target="_blank"><img src="${esc(img.url)}" style="width:180px;height:180px;object-fit:cover;border-radius:10px;border:1px solid var(--line)"></a>`).join("")}
    <div><div class="pill ${job.status==="succeeded"?"ok":job.status==="failed"?"bad":""}">${esc(job.status)}</div><p class="muted">${esc(job.error||job.progress||job.model||"")}</p>${job.error?`<p class="muted">${esc(job.error)}</p>`:""}</div></div>`;
  if(big)$("#genResult").innerHTML=html;
}
async function loadJobs(){
  try{const d=await api("/api/image-tasks");const rows=(d.items||[]).slice(0,12);$("#genJobs").innerHTML=rows.length?`<table><tr><th>状态</th><th>模型</th><th>时间</th><th>操作</th></tr>${rows.map(j=>`<tr><td><span class="pill ${j.status==="succeeded"?"ok":j.status==="failed"?"bad":""}">${esc(j.status)}</span></td><td>${esc(j.model)}</td><td class="muted">${esc(j.created_at)}</td><td><button onclick="showJob('${esc(j.id)}')">查看</button></td></tr>`).join("")}</table>`:"<p class='muted'>暂无任务</p>";}
  catch(e){$("#genJobs").textContent=e.message}
}
function showJob(id){api("/api/image-tasks").then(d=>{const j=(d.items||[]).find(x=>x.id===id);if(j)renderJob(j,true)}).catch(e=>toast(e.message))}
async function loadAccounts(){
  try{const d=await api("/api/accounts");const rows=d.items||[];$("#view-accounts").innerHTML=`
    <div class="card"><div class="row" style="justify-content:space-between"><div><h2>账号池</h2><span class="muted">共 ${rows.length} 个账号</span></div><div class="row"><button id="refreshAll">刷新全部</button><button id="importDir">导入 auth-dir</button><button id="exportAll">导出 JSON</button></div></div></div>
    <div class="card section"><h2>导入 Access Token / JSON</h2><p class="muted">支持每行一个 access_token，也支持直接粘贴完整账号 JSON；JSON 可来自账号导出、accounts/items/data 包装或 tokens 数组。</p><input id="importJsonFile" type="file" accept=".json,application/json" style="padding:7px"><textarea id="importTokens" placeholder="每行一个 access_token，或粘贴完整 JSON"></textarea><div class="row" style="margin-top:10px"><button class="primary" id="importBtn">导入并刷新</button><button id="importJsonBtn">导入 JSON 文件</button></div></div>
    <div class="card section"><h2>账号列表</h2>${rows.length?`<table><tr><th>邮箱 / ID</th><th>类型</th><th>状态</th><th>额度</th><th>代理</th><th>最近使用</th><th>操作</th></tr>${rows.map(a=>`<tr><td><div>${esc(a.email||"-")}</div><div class="muted" style="font-size:11px">${esc(a.id)}</div></td><td>${esc(a.type)}</td><td><span class="pill ${a.status==="normal"?"ok":a.status==="error"?"bad":""}">${esc(a.status)}</span></td><td>${esc(a.quota)}</td><td class="muted">${esc(a.proxy||"-")}</td><td class="muted">${esc(a.last_used_at||"-")}</td><td><button onclick="editAccount('${esc(a.id)}','${esc(a.status)}','${esc(a.proxy||"")}')">编辑</button> <button onclick="refreshAccount('${esc(a.id)}')">刷新</button> <button class="danger" onclick="deleteAccount('${esc(a.id)}')">删除</button></td></tr>`).join("")}</table>`:"<p class='muted'>暂无账号，先导入 Token。</p>"}</div>`;
    $("#refreshAll").onclick=()=>refreshAccounts([]);$("#importDir").onclick=importDir;$("#exportAll").onclick=exportAccounts;$("#importBtn").onclick=importTokens;$("#importJsonBtn").onclick=importJsonFile;}catch(e){$("#view-accounts").innerHTML=`<div class="card">${esc(e.message)}</div>`}
}
async function importTokens(){const text=$("#importTokens").value.trim();if(!text)return toast("请输入 Token 或 JSON");try{const d=/^[\[{]/.test(text)?await api("/api/accounts/import-json",{method:"POST",body:text}):await api("/api/accounts",{method:"POST",body:JSON.stringify({tokens:text.split(/\r?\n/).map(x=>x.trim()).filter(Boolean)})});toast(`新增 ${d.added||0}，刷新 ${d.refreshed||0}，失败 ${(d.errors||[]).length}`);loadAccounts()}catch(e){toast(e.message)}}
async function importJsonFile(){const file=$("#importJsonFile").files?.[0];if(!file)return toast("请选择 JSON 文件");try{const text=await file.text();const d=await api("/api/accounts/import-json",{method:"POST",body:text});toast(`新增 ${d.added||0}，刷新 ${d.refreshed||0}，失败 ${(d.errors||[]).length}`);loadAccounts()}catch(e){toast(e.message)}}
async function importDir(){const path=prompt("账号 JSON 目录（留空使用 config 的 auth-dir）","");if(path===null)return;try{const d=await api("/api/accounts/import-dir",{method:"POST",body:JSON.stringify({path})});toast(`新增 ${d.added||0}，刷新 ${d.refreshed||0}，失败 ${(d.errors||[]).length}`);loadAccounts()}catch(e){toast(e.message)}}
async function refreshAccount(id){try{await api("/api/accounts/"+encodeURIComponent(id)+"/refresh",{method:"POST"});toast("已刷新");loadAccounts()}catch(e){toast(e.message)}}
async function refreshAccounts(ids){try{const d=await api("/api/accounts/refresh",{method:"POST",body:JSON.stringify({ids})});toast(`刷新 ${d.refreshed||0} 个`);loadAccounts()}catch(e){toast(e.message)}}
async function deleteAccount(id){if(!confirm("确认删除此账号？"))return;try{await api("/api/accounts",{method:"DELETE",body:JSON.stringify({ids:[id]})});toast("已删除");loadAccounts()}catch(e){toast(e.message)}}
async function editAccount(id,status,proxy){const nextProxy=prompt("账号代理（留空走全局代理）",proxy||"");if(nextProxy===null)return;const nextStatus=prompt("状态：normal / limited / error / disabled",status||"normal");if(nextStatus===null)return;try{await api("/api/accounts/"+encodeURIComponent(id),{method:"PATCH",body:JSON.stringify({proxy:nextProxy,status:nextStatus})});toast("已更新");loadAccounts()}catch(e){toast(e.message)}}
async function exportAccounts(){const res=await fetch("/api/accounts/export",{method:"POST",headers:{"Content-Type":"application/json","X-Management-Key":state.key},body:JSON.stringify({ids:[]})});if(!res.ok){toast("导出失败");return}const blob=await res.blob();const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="accounts.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function loadImages(){try{const d=await api("/api/images");const rows=d.items||[];$("#view-images").innerHTML=`<div class="card"><h2>图片</h2><span class="muted">最近 ${rows.length} 张，图片文件不在浏览器内存中加载</span></div><div class="gallery section">${rows.map(i=>`<div class="thumb"><a href="${esc(i.url)}" target="_blank"><img src="${esc(i.url)}" loading="lazy"></a><div>${esc(i.width)}×${esc(i.height)} · ${esc(i.created_at)}</div></div>`).join("")}</div>`;}catch(e){$("#view-images").innerHTML=`<div class="card">${esc(e.message)}</div>`}}
async function loadKeys(){try{const d=await api("/api/access/keys");const rows=d.items||[];$("#view-keys").innerHTML=`<div class="card"><div class="row" style="justify-content:space-between"><div><h2>客户端 API Key</h2><span class="muted">仅用于 /v1/* 和任务查询，不能访问管理接口。</span></div><button class="primary" id="createKey">创建 Key</button></div></div><div class="card section"><table><tr><th>名称</th><th>Key</th><th>状态</th><th>创建时间</th><th>操作</th></tr>${rows.map(k=>`<tr><td>${esc(k.name)}</td><td class="muted">${esc(k.masked)}</td><td><span class="pill ${k.enabled?"ok":"bad"}">${k.enabled?"启用":"停用"}</span></td><td class="muted">${esc(k.created_at||"-")}</td><td><button class="danger" onclick="deleteKey('${esc(k.name)}')">删除</button></td></tr>`).join("")}</table></div>`;$("#createKey").onclick=createKey;}catch(e){$("#view-keys").innerHTML=`<div class="card">${esc(e.message)}</div>`}}
async function createKey(){const name=prompt("Key 名称","client");if(name===null)return;try{const d=await api("/api/access/keys",{method:"POST",body:JSON.stringify({name})});prompt("API Key 只显示一次，请复制保存：",d.key);loadKeys()}catch(e){toast(e.message)}}
async function deleteKey(name){if(!confirm("删除此 Key？"))return;try{await api("/api/access/keys/"+encodeURIComponent(name),{method:"DELETE"});loadKeys()}catch(e){toast(e.message)}}
async function loadSettings(){try{const d=await api("/api/access/settings");$("#view-settings").innerHTML=`<div class="card"><h2>访问设置</h2><p class="muted">以下连接信息来自当前配置文件，修改 host、port 或目录后需要重启进程。</p><div class="settings-grid"><div><label class="label">主机地址</label><input value="${esc(d.host)}" readonly></div><div><label class="label">端口</label><input id="settingsPort" type="number" min="1" max="65535" value="${esc(d.port)}"></div><div class="wide"><label class="label">上游代理 proxy-url</label><input id="settingsProxy" value="${esc(d.proxy_url||"")}" placeholder="http://127.0.0.1:10808"><span class="muted">留空表示直连。保存后新建请求和内置 solver 页面会使用该代理。</span></div><div class="wide"><label class="label">认证目录 auth-dir</label><input value="${esc(d.auth_dir)}" readonly></div><div class="wide"><label class="label">数据目录 data-dir</label><input value="${esc(d.data_dir)}" readonly></div><div class="wide"><label class="label">内置 Solver 浏览器</label><input value="${esc(d.sentinel_browser_path||"自动检测")}" readonly></div><div class="wide"><label class="label">内置 Solver 时区</label><input value="${esc(d.sentinel_timezone||"系统默认")}" readonly></div></div><div class="section"><div class="row"><button class="primary" id="saveAccess">保存</button></div></div><div class="section"><label class="label">轮换管理密钥</label><input id="newMgmt" type="password" placeholder="留空不修改"><button id="rotateMgmt" style="margin-top:8px">更新管理密钥</button></div></div>`;$("#saveAccess").onclick=saveAccess;$("#rotateMgmt").onclick=rotateMgmt;}catch(e){$("#view-settings").innerHTML=`<div class="card">${esc(e.message)}</div>`}}
async function saveAccess(){const port=Number($("#settingsPort").value);if(!Number.isInteger(port)||port<1||port>65535)return toast("端口必须在 1-65535 之间");try{await api("/api/access/settings",{method:"PUT",body:JSON.stringify({port,proxy_url:$("#settingsProxy").value.trim()})});toast("已保存；端口需重启，代理已应用")}catch(e){toast(e.message)}}
async function rotateMgmt(){const key=$("#newMgmt").value.trim();if(!key)return toast("请输入新密钥");try{await api("/api/access/settings",{method:"PUT",body:JSON.stringify({management_key:key})});state.key=key;sessionStorage.setItem("ch2a_mgmt",key);toast("管理密钥已更新");$("#newMgmt").value=""}catch(e){toast(e.message)}}
$("#loginBtn").onclick=()=>connect($("#managementKey").value);
$("#managementKey").addEventListener("keydown",e=>{if(e.key==="Enter")connect(e.target.value)});
$("#logoutBtn").onclick=()=>{sessionStorage.removeItem("ch2a_mgmt");location.reload()};
if(state.key){$("#managementKey").value=state.key;connect(state.key)}
</script>
</body>
</html>
