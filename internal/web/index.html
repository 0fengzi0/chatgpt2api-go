<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="data:,">
  <title>ChatGPT2API Image Gateway</title>
  <style>
    :root{
      --bg:#f4f6f8;--panel:#fff;--line:#d9dee5;--text:#17202a;--muted:#647180;
      --accent:#0f766e;--accent-strong:#115e59;--danger:#b42318;--warning:#b54708;
      --success:#067647;--blue:#175cd3;--soft:#eef2f5;--shadow:0 1px 2px rgba(16,24,40,.06)
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
    button,input,select,textarea{font:inherit}
    button{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:6px;min-height:34px;padding:6px 12px;cursor:pointer}
    button:hover{border-color:#aeb7c2;background:#fafbfc}
    button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
    button.primary:hover{background:var(--accent-strong)}
    button.danger{color:var(--danger);border-color:#efc9c5}
    button:disabled{opacity:.45;cursor:not-allowed}
    input,select,textarea{width:100%;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--text);padding:8px 10px;outline:none}
    input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(15,118,110,.1)}
    textarea{min-height:112px;resize:vertical}
    label{display:grid;gap:5px;color:#344054;font-size:13px}
    .app-header{height:58px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.96);position:sticky;top:0;z-index:20}
    .brand{display:flex;align-items:baseline;gap:10px;min-width:0}
    .brand strong{font-size:17px;white-space:nowrap}
    .brand span{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .header-tools{display:flex;align-items:center;gap:8px}
    .status-dot{width:8px;height:8px;border-radius:50%;background:#98a2b3;display:inline-block}
    .status-dot.ok{background:var(--success)}.status-dot.bad{background:var(--danger)}
    .muted{color:var(--muted)}.small{font-size:12px}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
    .login-wrap{min-height:calc(100vh - 58px);display:grid;place-items:center;padding:24px}
    .login-panel{width:min(420px,100%);background:#fff;border:1px solid var(--line);border-radius:8px;padding:24px;box-shadow:var(--shadow)}
    .login-panel h1{font-size:22px;margin:0 0 6px}.login-panel p{margin:0 0 20px}
    .app-shell{display:grid;grid-template-columns:190px minmax(0,1fr);align-content:start;min-height:calc(100vh - 58px)}
    .sidebar{border-right:1px solid var(--line);background:#fbfcfd;padding:14px 10px}
    .nav{display:grid;gap:3px;position:sticky;top:72px}
    .nav button{text-align:left;border-color:transparent;background:transparent;color:#475467;min-height:38px}
    .nav button.active{background:#e7f4f1;color:var(--accent-strong);font-weight:650}
    .content{padding:20px 24px 36px;min-width:0}
    .page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:16px}
    .page-head h1{font-size:22px;line-height:1.2;margin:0 0 3px}.page-head p{margin:0}
    .toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .stats-grid{display:grid;grid-template-columns:repeat(6,minmax(120px,1fr));gap:10px;margin-bottom:14px}
    .metric{background:#fff;border:1px solid var(--line);border-radius:8px;padding:13px;box-shadow:var(--shadow)}
    .metric .label{font-size:12px;color:var(--muted)}.metric .value{font-size:24px;font-weight:700;margin-top:2px}
    .panel{background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);overflow:hidden}
    .panel-head{padding:12px 14px;border-bottom:1px solid #eaecf0;display:flex;align-items:center;justify-content:space-between;gap:10px}
    .panel-body{padding:14px}
    .overview-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}
    .kv{display:grid;grid-template-columns:150px minmax(0,1fr);border-top:1px solid #eaecf0}
    .kv:first-child{border-top:0}.kv dt,.kv dd{margin:0;padding:10px 12px}.kv dt{color:var(--muted)}.kv dd{font-weight:550;word-break:break-word}
    .table-wrap{overflow:auto}
    table{width:100%;border-collapse:collapse;min-width:860px}
    th,td{text-align:left;padding:10px 11px;border-bottom:1px solid #eaecf0;vertical-align:middle}
    th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:#f9fafb;white-space:nowrap}
    tr:last-child td{border-bottom:0}
    .pill{display:inline-flex;align-items:center;border-radius:999px;padding:2px 8px;font-size:12px;border:1px solid var(--line);white-space:nowrap}
    .pill.ok{color:var(--success);border-color:#abefc6;background:#ecfdf3}
    .pill.warn{color:var(--warning);border-color:#fedf89;background:#fffaeb}
    .pill.bad{color:var(--danger);border-color:#fecdca;background:#fef3f2}
    .pill.off{color:#475467;background:#f2f4f7}
    .actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{min-height:30px;padding:4px 9px;font-size:12px}
    .restore-time{min-width:170px}.restore-time .small{margin-top:4px;white-space:nowrap}
    .empty{padding:38px 18px;text-align:center;color:var(--muted)}
    .form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
    .form-grid .wide{grid-column:1/-1}
    .form-actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
    .filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px;margin-bottom:12px}
    dialog{width:min(620px,calc(100vw - 30px));border:1px solid var(--line);border-radius:8px;padding:0;box-shadow:0 24px 70px rgba(16,24,40,.22)}
    dialog::backdrop{background:rgba(15,23,42,.36)}
    .dialog-head{padding:15px 18px;border-bottom:1px solid #eaecf0;display:flex;justify-content:space-between;align-items:center}
    .dialog-head h2{font-size:17px;margin:0}.dialog-body{padding:18px}.dialog-foot{padding:13px 18px;border-top:1px solid #eaecf0;display:flex;justify-content:flex-end;gap:8px}
    .secret{display:block;padding:11px;border:1px solid #fecdca;border-radius:6px;background:#fffbfa;word-break:break-all;font-family:ui-monospace,Consolas,monospace}
    #toast{position:fixed;right:18px;bottom:18px;z-index:80;max-width:380px;background:#17202a;color:#fff;padding:10px 13px;border-radius:7px;opacity:0;transform:translateY(8px);pointer-events:none;transition:.18s}
    #toast.show{opacity:1;transform:none}
    .hidden{display:none!important}
    @media(max-width:1100px){.stats-grid{grid-template-columns:repeat(3,minmax(120px,1fr))}.overview-grid{grid-template-columns:1fr}}
    @media(max-width:760px){
      .app-header{padding:0 14px}.brand span{display:none}
      .app-shell{grid-template-columns:1fr}.sidebar{border-right:0;border-bottom:1px solid var(--line);padding:8px}
      .nav{display:flex;overflow:auto;position:static}.nav button{white-space:nowrap}
      .content{padding:16px 12px 30px}.page-head{align-items:flex-start;flex-direction:column}
      .stats-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.form-grid{grid-template-columns:1fr}.form-grid .wide{grid-column:auto}
      .filters{grid-template-columns:1fr}.kv{grid-template-columns:120px minmax(0,1fr)}
    }
  </style>
</head>
<body>
<header class="app-header">
  <div class="brand"><strong>ChatGPT2API</strong><span>Image Gateway Console</span></div>
  <div class="header-tools">
    <span class="small muted"><span id="connDot" class="status-dot"></span> <span id="connText">未连接</span></span>
    <button id="logoutBtn" class="hidden">退出</button>
  </div>
</header>

<div id="loginView" class="login-wrap">
  <form id="loginForm" class="login-panel">
    <h1>管理控制台</h1>
    <p class="muted">使用管理密钥进入生图网关控制台。</p>
    <label>管理密钥<input id="managementKey" type="password" autocomplete="off" required></label>
    <div class="form-actions"><button class="primary" type="submit">登录</button></div>
  </form>
</div>

<div id="appView" class="app-shell hidden">
  <aside class="sidebar">
    <nav id="nav" class="nav">
      <button data-view="overview" class="active">概览</button>
      <button data-view="accounts">账号池</button>
      <button data-view="keys">API Key</button>
      <button data-view="settings">运行设置</button>
      <button data-view="logs">日志</button>
    </nav>
  </aside>
  <main class="content">
    <section id="view-overview"></section>
    <section id="view-accounts" class="hidden"></section>
    <section id="view-keys" class="hidden"></section>
    <section id="view-settings" class="hidden"></section>
    <section id="view-logs" class="hidden"></section>
  </main>
</div>

<dialog id="modal">
  <div class="dialog-head"><h2 id="modalTitle"></h2><button type="button" id="modalClose">关闭</button></div>
  <div id="modalBody" class="dialog-body"></div>
  <div id="modalFoot" class="dialog-foot"></div>
</dialog>
<div id="toast"></div>

<script>
const $=(selector,root=document)=>root.querySelector(selector);
const esc=(value)=>String(value??"").replace(/[&<>"']/g,(char)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
const state={key:sessionStorage.getItem("ch2a_management_key")||"",view:"overview",accounts:[],accountQuery:"",accountStatus:"all",overviewTimer:null,logType:"request",accountEventAccount:"",logFilters:{owner:"",model:"",mode:"",status:"",start:"",end:""}};

function toast(message){
  const node=$("#toast"); node.textContent=message; node.classList.add("show");
  clearTimeout(toast.timer); toast.timer=setTimeout(()=>node.classList.remove("show"),2600);
}

async function api(path,options={}){
  const headers=Object.assign({"Content-Type":"application/json","X-Management-Key":state.key},options.headers||{});
  const response=await fetch(path,{...options,headers});
  const type=response.headers.get("content-type")||"";
  const payload=type.includes("application/json")?await response.json():await response.text();
  if(response.status===401){logout();throw new Error("管理密钥无效");}
  if(!response.ok){
    const error=payload?.error;
    throw new Error(typeof error==="string"?error:error?.message||`HTTP ${response.status}`);
  }
  return payload;
}

function setConnection(ok,text){
  $("#connDot").className=`status-dot ${ok?"ok":"bad"}`;
  $("#connText").textContent=text;
}

function logout(){
  state.key=""; sessionStorage.removeItem("ch2a_management_key");
  clearInterval(state.overviewTimer); state.overviewTimer=null;
  $("#appView").classList.add("hidden"); $("#logoutBtn").classList.add("hidden");
  $("#loginView").classList.remove("hidden"); setConnection(false,"未连接");
}

async function login(key){
  state.key=key.trim();
  await api("/auth/login",{method:"POST",body:"{}",headers:{"X-Management-Key":state.key}});
  sessionStorage.setItem("ch2a_management_key",state.key);
  $("#loginView").classList.add("hidden"); $("#appView").classList.remove("hidden");
  $("#logoutBtn").classList.remove("hidden"); setConnection(true,"已连接");
  await switchView("overview");
}

function modal(title,body,actions=[]){
  $("#modalTitle").textContent=title; $("#modalBody").innerHTML=body;
  const foot=$("#modalFoot"); foot.innerHTML="";
  actions.forEach((item)=>{
    const button=document.createElement("button");
    button.textContent=item.label;
    if(item.primary) button.className="primary";
    if(item.danger) button.className="danger";
    button.onclick=item.onClick;
    foot.appendChild(button);
  });
  $("#modal").showModal();
}

async function switchView(view){
  state.view=view;
  document.querySelectorAll("#nav button").forEach((button)=>button.classList.toggle("active",button.dataset.view===view));
  ["overview","accounts","keys","settings","logs"].forEach((name)=>$(`#view-${name}`).classList.toggle("hidden",name!==view));
  clearInterval(state.overviewTimer); state.overviewTimer=null;
  if(view==="overview"){await loadOverview();state.overviewTimer=setInterval(()=>loadOverview(true),15000);}
  if(view==="accounts") await loadAccounts();
  if(view==="keys") await loadKeys();
  if(view==="settings") await loadSettings();
  if(view==="logs") await loadLogs();
}

async function loadOverview(quiet=false){
  try{
    const data=await api("/api/status");
    const stats=data.stats||{}, runtime=data.runtime||{}, solver=data.solver||{};
    setConnection(true,"已连接");
    $("#view-overview").innerHTML=`
      <div class="page-head"><div><h1>概览</h1><p class="muted">账号、额度、任务和运行环境</p></div><div class="toolbar"><button id="refreshOverview">刷新</button></div></div>
      <div class="stats-grid">
        ${metric("可用账号",stats.accounts_active||0)}
        ${metric("剩余额度",stats.quota_total||0)}
        ${metric("运行请求",runtime.active_requests||0)}
        ${metric("排队请求",runtime.queued_requests||0)}
        ${metric("今日生成",stats.images_today||0)}
        ${metric("今日失败",stats.requests_failed_today||0)}
      </div>
      <div class="overview-grid">
        <section class="panel"><div class="panel-head"><strong>运行状态</strong><span class="muted small">${Number(runtime.uptime_seconds||0)} 秒</span></div><dl class="kv">
          ${kv("账号总数",stats.accounts_total||0)}${kv("限流账号",stats.accounts_limited||0)}
          ${kv("异常账号",stats.accounts_error||0)}${kv("禁用账号",stats.accounts_disabled||0)}
          ${kv("今日请求",stats.requests_today||0)}${kv("今日平均耗时",`${Number(stats.request_duration_avg_today_ms||0).toFixed(0)} ms`)}
          ${kv("临时文件",stats.temporary_files||0)}${kv("临时存储",formatBytes(stats.temporary_bytes||0))}
        </dl></section>
        <section class="panel"><div class="panel-head"><strong>Solver</strong><span class="pill ${solver.ready?"ok":"bad"}">${solver.ready?"就绪":"未就绪"}</span></div><dl class="kv">
          ${kv("浏览器",solver.browser_version||"—")}${kv("路径",solver.browser_path||"—")}
          ${kv("时区",solver.timezone||"—")}${kv("最近错误",solver.last_error||"—")}
        </dl></section>
      </div>`;
    $("#refreshOverview").onclick=()=>loadOverview(false);
  }catch(error){if(!quiet)toast(error.message);setConnection(false,"连接异常");}
}

function metric(label,value){return `<div class="metric"><div class="label">${esc(label)}</div><div class="value">${esc(value)}</div></div>`}
function kv(label,value){return `<dt>${esc(label)}</dt><dd>${esc(value)}</dd>`}
function formatBytes(value){const number=Number(value||0);if(number>=1024*1024*1024)return`${(number/1024/1024/1024).toFixed(2)} GB`;if(number>=1024*1024)return`${(number/1024/1024).toFixed(2)} MB`;if(number>=1024)return`${(number/1024).toFixed(1)} KB`;return`${number} B`}

function formatRestoreAt(value){
  const raw=String(value||"").trim();
  if(!raw)return{relative:"—",absolute:"",kind:"off"};
  let date;
  if(/^\d+(?:\.\d+)?$/.test(raw)){
    let timestamp=Number(raw);
    if(timestamp<100000000000)timestamp*=1000;
    date=new Date(timestamp);
  }else{
    date=new Date(raw);
  }
  if(Number.isNaN(date.getTime()))return{relative:raw,absolute:"",kind:"off"};
  const pad=(number)=>String(number).padStart(2,"0");
  const absolute=`${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}`;
  const diff=date.getTime()-Date.now();
  if(diff<=0)return{relative:"已到恢复时间",absolute,kind:"ok"};
  const totalMinutes=Math.ceil(diff/60000);
  if(totalMinutes<60)return{relative:`${totalMinutes} 分钟后`,absolute,kind:"warn"};
  const totalHours=Math.floor(totalMinutes/60);
  if(totalHours<24)return{relative:`${totalHours} 小时 ${totalMinutes%60} 分后`,absolute,kind:"warn"};
  const days=Math.floor(totalHours/24);
  return{relative:`${days} 天 ${totalHours%24} 小时后`,absolute,kind:"warn"};
}

async function loadAccounts(){
  try{
    const data=await api("/api/accounts");
    state.accounts=data.items||[];
    $("#view-accounts").innerHTML=`
      <div class="page-head"><div><h1>账号池</h1><p class="muted">导入、刷新、禁用和代理配置</p></div><div class="toolbar">
        <button class="primary" id="importAccounts">导入账号</button><button id="refreshAllAccounts">全部刷新</button><button id="exportAccounts">导出 JSON</button>
      </div></div>
      <div class="filters"><input id="accountQuery" placeholder="搜索邮箱、ID 或状态"><select id="accountStatus"><option value="all">全部状态</option><option value="normal">正常</option><option value="limited">限流</option><option value="error">异常</option><option value="disabled">禁用</option></select><button id="clearAccountFilters">清除筛选</button></div>
      <section class="panel"><div id="accountsTable"></div></section>`;
    $("#accountQuery").value=state.accountQuery; $("#accountStatus").value=state.accountStatus;
    $("#accountQuery").oninput=(event)=>{state.accountQuery=event.target.value;renderAccountsTable();};
    $("#accountStatus").onchange=(event)=>{state.accountStatus=event.target.value;renderAccountsTable();};
    $("#clearAccountFilters").onclick=()=>{state.accountQuery="";state.accountStatus="all";loadAccounts();};
    $("#importAccounts").onclick=openAccountImport;
    $("#refreshAllAccounts").onclick=async()=>{await actionButton($("#refreshAllAccounts"),"刷新中",async()=>{const result=await api("/api/accounts/refresh",{method:"POST",body:"{}"});toast(`刷新完成 ${result.refreshed||0}`);await loadAccounts();});};
    $("#exportAccounts").onclick=exportAccounts;
    renderAccountsTable();
  }catch(error){toast(error.message)}
}

function renderAccountsTable(){
  const query=state.accountQuery.trim().toLowerCase();
  const items=state.accounts.filter((item)=>{
    const haystack=`${item.email||""} ${item.user_id||""} ${item.id||""}`.toLowerCase();
    return (!query||haystack.includes(query))&&(state.accountStatus==="all"||item.status===state.accountStatus);
  });
  const host=$("#accountsTable"); if(!host)return;
  if(items.length===0){host.innerHTML=`<div class="empty">没有匹配账号</div>`;return}
  host.innerHTML=`<div class="table-wrap"><table><thead><tr><th>账号</th><th>状态</th><th>套餐</th><th>额度</th><th>恢复时间</th><th>成功/失败</th><th>代理</th><th>操作</th></tr></thead><tbody>${items.map((item)=>`
    <tr>
      <td><div>${esc(item.email||"未命名")}</div><div class="small muted mono">${esc(item.id)}</div></td>
      <td>${statusPill(item.status)}</td><td>${esc(item.type||"free")}</td><td>${Math.max(0,Number(item.quota||0))}</td>
      <td class="restore-time">${restoreTimeHTML(item.restore_at)}</td><td>${Number(item.success||0)} / ${Number(item.fail||0)}</td>
      <td class="small mono">${esc(item.proxy||"direct")}</td>
      <td><div class="actions"><button data-action="refresh" data-id="${esc(item.id)}">刷新</button><button data-action="edit" data-id="${esc(item.id)}">编辑</button><button class="danger" data-action="delete" data-id="${esc(item.id)}">删除</button></div></td>
    </tr>`).join("")}</tbody></table></div>`;
  host.querySelectorAll("button[data-action]").forEach((button)=>button.onclick=()=>accountAction(button.dataset.action,button.dataset.id));
}

function restoreTimeHTML(value){
  const formatted=formatRestoreAt(value);
  if(!formatted.absolute)return esc(formatted.relative);
  return `<span class="pill ${formatted.kind}">${esc(formatted.relative)}</span><div class="small muted">${esc(formatted.absolute)}</div>`;
}

function statusPill(status){
  const map={normal:["正常","ok"],limited:["限流","warn"],error:["异常","bad"],disabled:["禁用","off"]};
  const [label,kind]=map[status]||[status||"未知","off"];
  return `<span class="pill ${kind}">${esc(label)}</span>`;
}

async function accountAction(action,id){
  const item=state.accounts.find((account)=>account.id===id); if(!item)return;
  if(action==="refresh"){
    try{await api(`/api/accounts/${encodeURIComponent(id)}/refresh`,{method:"POST",body:"{}"});toast("账号已刷新");await loadAccounts();}catch(error){toast(error.message)} return;
  }
  if(action==="delete"){
    if(!confirm(`删除账号 ${item.email||id}？`))return;
    try{await api("/api/accounts",{method:"DELETE",body:JSON.stringify({ids:[id]})});toast("账号已删除");await loadAccounts();}catch(error){toast(error.message)} return;
  }
  modal("编辑账号",`
    <div class="form-grid"><label>状态<select id="editAccountStatus">${["normal","limited","error","disabled"].map((value)=>`<option value="${value}" ${item.status===value?"selected":""}>${value}</option>`).join("")}</select></label>
    <label>代理<input id="editAccountProxy" value="${esc(item.proxy||"")}" placeholder="http://127.0.0.1:10808"></label></div>`,
    [{label:"保存",primary:true,onClick:async()=>{
      try{await api(`/api/accounts/${encodeURIComponent(id)}`,{method:"PATCH",body:JSON.stringify({status:$("#editAccountStatus").value,proxy:$("#editAccountProxy").value})});$("#modal").close();toast("账号已更新");await loadAccounts();}catch(error){toast(error.message)}
    }}]);
}

function openAccountImport(){
  modal("导入账号",`<div class="form-grid"><div class="wide"><label>账号 JSON 或 Access Token<textarea id="accountImportText" placeholder='{"access_token":"..."} 或每行一个 Access Token'></textarea></div><div class="wide"><label>选择 JSON 文件<input id="accountImportFile" type="file" accept=".json,application/json"></label></div></div>`,
  [{label:"导入",primary:true,onClick:async()=>{
    const text=$("#accountImportText").value.trim(); if(!text){toast("请输入账号内容");return}
    try{
      let result;
      if(text.startsWith("{")||text.startsWith("[")) result=await api("/api/accounts/import-json",{method:"POST",body:text});
      else result=await api("/api/accounts",{method:"POST",body:JSON.stringify({tokens:text.split(/\r?\n/).map((item)=>item.trim()).filter(Boolean)})});
      $("#modal").close();toast(`新增 ${result.added||0}，跳过 ${result.skipped||0}`);await loadAccounts();
    }catch(error){toast(error.message)}
  }}]);
  $("#accountImportFile").onchange=async(event)=>{
    const file=event.target.files?.[0]; if(file)$("#accountImportText").value=await file.text();
  };
}

async function exportAccounts(){
  try{
    const response=await fetch("/api/accounts/export",{method:"POST",headers:{"Content-Type":"application/json","X-Management-Key":state.key},body:"{}"});
    if(!response.ok)throw new Error(`HTTP ${response.status}`);
    const blob=await response.blob();const link=document.createElement("a");
    link.href=URL.createObjectURL(blob);link.download="accounts.json";link.click();URL.revokeObjectURL(link.href);
  }catch(error){toast(error.message)}
}

async function loadKeys(){
  try{
    const data=await api("/api/access/keys");
    $("#view-keys").innerHTML=`<div class="page-head"><div><h1>API Key</h1><p class="muted">客户端访问凭据，配额由 New API 管理</p></div><button class="primary" id="createKey">创建 Key</button></div><section class="panel"><div class="table-wrap"><table><thead><tr><th>名称</th><th>状态</th><th>请求</th><th>失败</th><th>最后使用</th><th>操作</th></tr></thead><tbody>${(data.items||[]).map((item)=>`<tr><td><strong>${esc(item.name)}</strong><div class="small muted mono">${esc(item.masked)}</div></td><td><span class="pill ${item.enabled?"ok":"off"}">${item.enabled?"启用":"禁用"}</span></td><td>${Number(item.requests||0)}</td><td>${Number(item.failures||0)}</td><td class="small">${esc(item.last_used_at||"—")}</td><td><div class="actions"><button data-key-action="toggle" data-name="${esc(item.name)}" data-enabled="${item.enabled}">${item.enabled?"禁用":"启用"}</button><button data-key-action="rename" data-name="${esc(item.name)}">重命名</button><button class="danger" data-key-action="delete" data-name="${esc(item.name)}">删除</button></div></td></tr>`).join("")}</tbody></table></div></section>`;
    $("#createKey").onclick=createKey;
    document.querySelectorAll("button[data-key-action]").forEach((button)=>button.onclick=()=>keyAction(button.dataset.keyAction,button.dataset.name,button.dataset.enabled==="true"));
  }catch(error){toast(error.message)}
}

async function createKey(){
  const name=prompt("Key 名称"); if(name===null)return;
  try{const result=await api("/api/access/keys",{method:"POST",body:JSON.stringify({name})});await loadKeys();modal("API Key 已创建",`<p class="muted">明文只显示一次。</p><code class="secret">${esc(result.key)}</code>`,[{label:"关闭",onClick:()=>$("#modal").close()}]);}catch(error){toast(error.message)}
}

async function keyAction(action,name,enabled){
  if(action==="toggle"){
    try{await api(`/api/access/keys/${encodeURIComponent(name)}`,{method:"PATCH",body:JSON.stringify({enabled:!enabled})});await loadKeys();}catch(error){toast(error.message)}return;
  }
  if(action==="rename"){
    const next=prompt("新名称",name);if(next===null||next.trim()===name)return;
    try{await api(`/api/access/keys/${encodeURIComponent(name)}`,{method:"PATCH",body:JSON.stringify({name:next.trim()})});await loadKeys();}catch(error){toast(error.message)}return;
  }
  if(action==="delete"&&confirm(`删除 API Key ${name}？`)){
    try{await api(`/api/access/keys/${encodeURIComponent(name)}`,{method:"DELETE"});await loadKeys();}catch(error){toast(error.message)}
  }
}

async function loadSettings(){
  try{
    const config=await api("/api/access/settings");
    $("#view-settings").innerHTML=`<div class="page-head"><div><h1>运行设置</h1><p class="muted">配置保存到当前配置文件</p></div></div><section class="panel"><div class="panel-body">
      <div class="form-grid">
        ${field("监听地址","settingsHost",config.host,true)}${field("端口","settingsPort",config.port,false,"number")}
        ${field("全局并发","settingsGlobalConcurrency",config.global_concurrency,false,"number")}${field("单账号并发","settingsAccountConcurrency",config.account_concurrency,false,"number")}
        ${field("请求超时（秒）","settingsRequestTimeout",config.request_timeout_seconds,false,"number")}${field("临时 URL（秒）","settingsTempTTL",config.temporary_url_ttl_seconds,false,"number")}
        ${field("日志保留（天）","settingsLogRetention",config.log_retention_days,false,"number")}${field("刷新间隔（分钟）","settingsRefreshInterval",config.refresh_interval_minutes,false,"number")}
        ${field("公共基础 URL","settingsPublicBaseURL",config.public_base_url||"")}${field("默认上游模型","settingsUpstreamModel",config.default_upstream_model)}
        ${field("全局代理","settingsProxyURL",config.proxy_url||"")}${field("Solver 浏览器","settingsBrowserPath",config.sentinel_browser_path||"")}
        ${field("Solver 时区","settingsTimezone",config.sentinel_timezone||"")}
        <label class="wide">自动移除无效账号<span><input id="settingsAutoRemoveInvalid" type="checkbox" style="width:auto;margin-right:7px" ${config.auto_remove_invalid_accounts?"checked":""}>Token 明确失效且无法刷新时删除账号</span></label>
        <label class="wide">敏感词（每行一个）<textarea id="settingsSensitiveWords">${esc((config.sensitive_words||[]).join("\n"))}</textarea></label>
        <label class="wide">轮换管理密钥<input id="settingsManagementKey" type="password" placeholder="留空不修改"></label>
      </div><div class="form-actions"><button class="primary" id="saveSettings">保存设置</button></div>
    </div></section>`;
    $("#saveSettings").onclick=saveSettings;
  }catch(error){toast(error.message)}
}

function field(label,id,value,readonly=false,type="text"){
  return `<label>${esc(label)}<input id="${id}" type="${type}" value="${esc(value??"")}" ${readonly?"readonly":""}></label>`;
}

async function saveSettings(){
  const payload={
    port:Number($("#settingsPort").value),global_concurrency:Number($("#settingsGlobalConcurrency").value),
    account_concurrency:Number($("#settingsAccountConcurrency").value),request_timeout_seconds:Number($("#settingsRequestTimeout").value),
    temporary_url_ttl_seconds:Number($("#settingsTempTTL").value),log_retention_days:Number($("#settingsLogRetention").value),
    refresh_interval_minutes:Number($("#settingsRefreshInterval").value),public_base_url:$("#settingsPublicBaseURL").value,
    default_upstream_model:$("#settingsUpstreamModel").value,proxy_url:$("#settingsProxyURL").value,
    sentinel_browser_path:$("#settingsBrowserPath").value,sentinel_timezone:$("#settingsTimezone").value,
    auto_remove_invalid_accounts:$("#settingsAutoRemoveInvalid").checked,
    sensitive_words:$("#settingsSensitiveWords").value.split(/\r?\n/).map((item)=>item.trim()).filter(Boolean),
    management_key:$("#settingsManagementKey").value
  };
  await actionButton($("#saveSettings"),"保存中",async()=>{
    try{
      await api("/api/access/settings",{method:"PUT",body:JSON.stringify(payload)});
      if(payload.management_key) {toast("设置已保存，请重新登录");logout();}
      else {toast("设置已保存");await loadSettings();}
    }catch(error){toast(error.message)}
  });
}

async function loadLogs(){
  try{
    const settings=await api("/api/access/settings");
    const typeSelector=`<select id="logType" style="max-width:180px"><option value="request" ${state.logType==="request"?"selected":""}>请求日志</option><option value="account" ${state.logType==="account"?"selected":""}>账号事件</option></select>`;
    if(state.logType==="account"){
      const params=new URLSearchParams({limit:"200"});
      if(state.accountEventAccount)params.set("account_id",state.accountEventAccount);
      const data=await api(`/api/account-events?${params}`);
      const items=data.items||[];
      $("#view-logs").innerHTML=`<div class="page-head"><div><h1>账号事件</h1><p class="muted">导入、刷新、Token、限流和禁用记录</p></div><div class="toolbar">${typeSelector}<button id="refreshLogs">刷新</button></div></div>
        <div class="filters"><input id="accountEventAccount" placeholder="账号 ID" value="${esc(state.accountEventAccount)}"><button id="applyAccountEventFilter">筛选</button><button id="clearAccountEventFilter">清除</button></div>
        <section class="panel"><div class="table-wrap"><table><thead><tr><th>时间</th><th>账号 ID</th><th>事件</th><th>详情</th></tr></thead><tbody>${items.length?items.map((item)=>`<tr><td class="small">${esc(item.created_at)}</td><td class="mono small">${esc(item.account_id)}</td><td>${esc(item.event)}</td><td>${esc(item.message||"—")}</td></tr>`).join(""):`<tr><td colspan="4"><div class="empty">暂无账号事件</div></td></tr>`}</tbody></table></div></section>`;
      $("#logType").onchange=(event)=>{state.logType=event.target.value;loadLogs();};
      $("#refreshLogs").onclick=loadLogs;
      $("#applyAccountEventFilter").onclick=()=>{state.accountEventAccount=$("#accountEventAccount").value.trim();loadLogs();};
      $("#clearAccountEventFilter").onclick=()=>{state.accountEventAccount="";loadLogs();};
      return;
    }
    const params=new URLSearchParams({limit:"200"});
    Object.entries(state.logFilters).forEach(([key,value])=>{if(value)params.set(key,value)});
    const data=await api(`/api/logs?${params}`);
    const items=data.items||[];
    $("#view-logs").innerHTML=`<div class="page-head"><div><h1>请求日志</h1><p class="muted">保留时间 ${esc(settings.log_retention_days)} 天</p></div><div class="toolbar">${typeSelector}<button id="refreshLogs">刷新</button><button class="danger" id="deleteSelectedLogs" disabled>删除所选</button></div></div>
      <div class="filters"><input id="logOwner" placeholder="API Key" value="${esc(state.logFilters.owner)}"><input id="logModel" placeholder="模型" value="${esc(state.logFilters.model)}"><select id="logMode"><option value="">全部模式</option><option value="generation">生成</option><option value="edit">编辑</option></select><select id="logStatus"><option value="">全部状态</option><option value="success">成功</option><option value="failed">失败</option></select><input id="logStart" type="date" value="${esc(state.logFilters.start)}"><input id="logEnd" type="date" value="${esc(state.logFilters.end)}"><button id="applyLogFilters">筛选</button><button id="clearLogFilters">清除</button></div>
      <section class="panel"><div class="table-wrap"><table><thead><tr><th><input id="selectAllLogs" type="checkbox"></th><th>时间</th><th>Key</th><th>模式</th><th>模型</th><th>状态</th><th>图片</th><th>耗时</th><th>账号</th></tr></thead><tbody>${items.length?items.map((item)=>`<tr><td><input class="log-check" type="checkbox" value="${Number(item.id)}"></td><td class="small">${esc(item.created_at)}</td><td>${esc(item.owner||"—")}</td><td>${esc(item.mode||"—")}</td><td>${esc(item.model||"—")}</td><td><span class="pill ${Number(item.status)<400?"ok":"bad"}">${Number(item.status)}</span>${item.error?`<div class="small muted">${esc(item.error)}</div>`:""}</td><td>${Number(item.succeeded_images||0)}/${Number(item.requested_images||0)}</td><td>${Number(item.duration_ms||0)} ms</td><td class="small mono">${esc(item.account_ids||"—")}</td></tr>`).join(""):`<tr><td colspan="9"><div class="empty">暂无日志</div></td></tr>`}</tbody></table></div></section>`;
    $("#logMode").value=state.logFilters.mode;$("#logStatus").value=state.logFilters.status;
    $("#logType").onchange=(event)=>{state.logType=event.target.value;loadLogs();};
    $("#refreshLogs").onclick=loadLogs;
    $("#applyLogFilters").onclick=()=>{
      state.logFilters={owner:$("#logOwner").value.trim(),model:$("#logModel").value.trim(),mode:$("#logMode").value,status:$("#logStatus").value,start:$("#logStart").value,end:$("#logEnd").value};
      loadLogs();
    };
    $("#clearLogFilters").onclick=()=>{state.logFilters={owner:"",model:"",mode:"",status:"",start:"",end:""};loadLogs();};
    $("#selectAllLogs").onchange=(event)=>document.querySelectorAll(".log-check").forEach((checkbox)=>{checkbox.checked=event.target.checked;syncLogDeleteButton();});
    document.querySelectorAll(".log-check").forEach((checkbox)=>checkbox.onchange=syncLogDeleteButton);
    $("#deleteSelectedLogs").onclick=deleteSelectedLogs;
  }catch(error){toast(error.message)}
}

function syncLogDeleteButton(){
  $("#deleteSelectedLogs").disabled=!document.querySelector(".log-check:checked");
}

async function deleteSelectedLogs(){
  const ids=Array.from(document.querySelectorAll(".log-check:checked")).map((item)=>Number(item.value));
  if(ids.length===0||!confirm(`删除 ${ids.length} 条日志？`))return;
  try{await api("/api/logs/delete",{method:"POST",body:JSON.stringify({ids})});toast("日志已删除");await loadLogs();}catch(error){toast(error.message)}
}

async function actionButton(button,busyText,action){
  const original=button.textContent;button.disabled=true;button.textContent=busyText;
  try{await action()}finally{button.disabled=false;button.textContent=original}
}

$("#loginForm").onsubmit=async(event)=>{
  event.preventDefault();
  const button=event.submitter;button.disabled=true;
  try{await login($("#managementKey").value);toast("登录成功");}
  catch(error){toast(error.message);button.disabled=false;setConnection(false,"未连接");}
};
$("#logoutBtn").onclick=logout;
$("#modalClose").onclick=()=>$("#modal").close();
$("#modal").addEventListener("click",(event)=>{if(event.target===$("#modal"))$("#modal").close()});
document.querySelectorAll("#nav button").forEach((button)=>button.onclick=()=>switchView(button.dataset.view));

if(state.key){
  login(state.key).catch(()=>{logout();toast("登录状态已失效");});
}
</script>
</body>
</html>
