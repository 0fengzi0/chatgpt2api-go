# ChatGPT2API Image Gateway example.
# Copy to config.yaml. Do not commit generated secrets or account data.

host: "127.0.0.1"
port: 3000
provider-base-url: "https://chatgpt.com"
public-base-url: "" # Production: https://api.example.com

cors:
  allowed-origins:
    - "https://5ixf.com"
    - "https://www.5ixf.com"
    - "https://*.5ixf.com"
    - "https://isancha.com"
    - "https://www.isancha.com"
    - "https://*.isancha.com"

sentinel:
  # Empty auto-detects Chromium, Chrome, or Edge.
  browser-path: ""
  timezone: "Asia/Shanghai"
  headless: true
  no-sandbox: true
  refresh-minutes: 30
  navigate-timeout-seconds: 60
  solve-timeout-seconds: 120

remote-management:
  # Empty on first start generates a key and prints it once.
  secret-key: ""

# Client keys for /v1/*. Multiple keys can also be managed in the admin UI.
api-keys: []

data-dir: "./data"
debug: false
logging-to-file: false
refresh-interval-minutes: 30

# Global proxy for ChatGPT and the embedded browser solver.
# Supported schemes: http, https, socks5, socks5h.
proxy-url: ""

image:
  account-concurrency: 1
  poll-timeout-seconds: 120
  poll-interval-seconds: 10
  request-timeout-seconds: 300
  temporary-url-ttl-seconds: 600
  queue-size: 100
  max-upload-bytes: 26214400
  max-image-bytes: 20971520
  max-image-pixels: 16777216
  max-dimension: 4096
  log-retention-days: 30
  auto-remove-invalid-accounts: false

performance:
  image-workers: 3
  account-refresh-workers: 1

sensitive-words: []

max-request-body-bytes: 110100480
default-upstream-model: "gpt-5-5"
default-thinking-effort: "auto"
