# ChatGPT2API 单机生图网关配置示例

host: "127.0.0.1"
port: 3000
provider-base-url: "https://chatgpt.com"
# 生产环境建议填写反向代理的公开 HTTPS 地址。
public-base-url: ""

cors:
  allowed-origins:
    - "https://5ixf.com"
    - "https://www.5ixf.com"
    - "https://*.5ixf.com"
    - "https://isancha.com"
    - "https://www.isancha.com"
    - "https://*.isancha.com"

# 内置 Turnstile Solver。
sentinel:
  browser-path: "" # 留空自动查找 Chromium、Chrome 或 Edge
  timezone: "Asia/Shanghai"
  headless: true
  no-sandbox: true
  refresh-minutes: 30
  navigate-timeout-seconds: 60
  solve-timeout-seconds: 120

remote-management:
  # 留空时首次启动生成并打印一次，仅保存 bcrypt 哈希。
  secret-key: ""

# 客户端 GPT Image API Key，可配置多个；不设置 Key 级配额。
api-keys: []

data-dir: "./data"
debug: false
logging-to-file: false
refresh-interval-minutes: 30

# 支持 http、https、socks5、socks5h。
proxy-url: ""

image:
  account-concurrency: 1
  poll-timeout-seconds: 120
  poll-interval-seconds: 10
  request-timeout-seconds: 300
  temporary-url-ttl-seconds: 600
  queue-size: 100
  max-upload-bytes: 26214400
  max-image-bytes: 20971520
  max-image-pixels: 16777216
  max-dimension: 4096
  log-retention-days: 30
  auto-remove-invalid-accounts: false

performance:
  # 全局同时执行的上游生图任务数，可在管理端调整。
  image-workers: 3
  account-refresh-workers: 1

# auto 审核会拒绝包含这些词的请求；low 模式跳过本地敏感词，仍受上游审核约束。
sensitive-words: []

# 4 张参考图，每张最大 25 MiB，另留 multipart 和 JSON 开销。
max-request-body-bytes: 110100480
default-upstream-model: "gpt-5-5"
default-thinking-effort: "auto"
